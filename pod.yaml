# Created with podman-5.8.7
apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.kubernetes.cri-o.SandboxID/client: c73ce208158ee036089faf9df317718316d18f84a16f5f243d9792398b541b5e
    io.kubernetes.cri-o.SandboxID/db: c73ce208158ee036089faf9df317718316d18f84a16f5f243d9792398b541b5e
    io.kubernetes.cri-o.SandboxID/server: c73ce208158ee036089faf9df317718316d18f84a16f5f243d9792398b541b5e
  creationTimestamp: "2026-10-08T00:20:37Z"
  labels:
    app: web
  name: web
spec:
  restartPolicy: Never
  containers:
    - args: # Web Client (Nginx)
        - nginx
        - -g
        - daemon off;
      image: localhost/client:latest
      name: client
      ports:
        - containerPort: 80
          hostPort: 8080
    - image: localhost/server:latest # Web Server (flask)
      name: server
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-root-password
              key: mysql_password
        - name: FLASK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: flask-secret-key
              key: secret_key
    - args: # Database (MySQL)
        - mysqld
      image: docker.io/library/mysql:latest
      name: db
      volumeMounts:
        - mountPath: /var/lib/mysql
          name: db-volume
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-root-password
              key: mysql_password
      ports:
        - containerPort: 3306
          hostPort: 3306
    - image: localhost/services:latest # Services
      name: services
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-root-password
              key: mysql_password
        - name: LLM_API_URL
          valueFrom:
            secretKeyRef:
              name: llm-api
              key: llm_api_url
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api
              key: llm_api_key
    - image: localhost/data:latest # Data initialization
      name: data
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-root-password
              key: mysql_password
        - name: LOAD_DUMMY_DATA
          value: "true"

  volumes:
    - name: db-volume
      persistentVolumeClaim:
        claimName: db-volume
