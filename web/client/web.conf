server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Single-page app: serve index.html for any path that is not a real
        # file, so refreshing /audits (or any client route) does not 404.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
      # Strip the /api prefix: the trailing "/" on proxy_pass replaces the
      # matched location with "/". Flask therefore serves /login, not
      # /api/login, and must be told where it is mounted -- see below.
      proxy_pass http://localhost:5000/;

      # Host/origin as the browser sees it, so redirects and request.url are
      # truthful.
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # The prefix that was stripped above. Flask's ProxyFix copies this into
      # SCRIPT_NAME, so url_for()/redirect() rebuild /api/... URLs.
      proxy_set_header X-Forwarded-Prefix /api;

      # Emit relative Location headers. Without this, nginx rewrites a
      # redirect to its own listen port (e.g. http://localhost/api/) and drops
      # the published :8080.
      absolute_redirect off;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
